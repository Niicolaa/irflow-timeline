name: Release Linux

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IRFLOW_UPDATE_BASE_URL: ${{ vars.IRFLOW_UPDATE_BASE_URL }}
      IRFLOW_UPDATE_CHANNEL: ${{ vars.IRFLOW_UPDATE_CHANNEL }}
      IRFLOW_UPDATE_BUCKET: ${{ vars.IRFLOW_UPDATE_BUCKET }}
      IRFLOW_UPDATE_PREFIX: ${{ vars.IRFLOW_UPDATE_PREFIX }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      AWS_ENDPOINT_URL_S3: ${{ vars.AWS_ENDPOINT_URL_S3 }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst6 \
            xauth \
            xvfb \
            rpm

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for var_name in \
            IRFLOW_UPDATE_BASE_URL \
            IRFLOW_UPDATE_BUCKET \
            AWS_REGION \
            AWS_ACCESS_KEY_ID \
            AWS_SECRET_ACCESS_KEY
          do
            if [ -z "${!var_name:-}" ]; then
              missing+=("$var_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required GitHub variables/secrets: ${missing[*]}"
            exit 1
          fi

          pkg_version="$(node -p "require('./package.json').version")"
          expected_tag="v${pkg_version}"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg_version}. Expected ${expected_tag}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild -f -w better-sqlite3

      - name: Build Linux release
        shell: bash
        run: |
          set -euo pipefail
          export IRFLOW_UPDATE_CHANNEL="${IRFLOW_UPDATE_CHANNEL:-latest}"
          rm -rf release
          npm run build:renderer
          npx electron-builder --config electron-builder.config.cjs --linux

      - name: Collect release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail

          pkg_version="$(node -p "require('./package.json').version")"
          channel="${IRFLOW_UPDATE_CHANNEL:-latest}"

          appimage_path="$(find release -maxdepth 1 -type f -name "*${pkg_version}*.AppImage" | sort | head -n 1)"
          deb_path="$(find release -maxdepth 1 -type f -name "*${pkg_version}*.deb" | sort | head -n 1)"
          rpm_path="$(find release -maxdepth 1 -type f -name "*${pkg_version}*.rpm" | sort | head -n 1)"

          if [ "${channel}" = "latest" ]; then
            yml_name="latest-linux.yml"
          else
            yml_name="${channel}-linux.yml"
          fi

          yml_path="release/${yml_name}"
          if [ ! -f "${yml_path}" ]; then
            yml_path="$(find release -maxdepth 1 -type f -name '*linux*.yml' | sort | head -n 1)"
          fi

          for path_name in appimage_path yml_path; do
            if [ -z "${!path_name:-}" ] || [ ! -f "${!path_name}" ]; then
              echo "::error::Missing expected release artifact: ${path_name}"
              exit 1
            fi
          done

          echo "appimage=${appimage_path}" >> "${GITHUB_OUTPUT}"
          echo "deb=${deb_path}" >> "${GITHUB_OUTPUT}"
          echo "rpm=${rpm_path}" >> "${GITHUB_OUTPUT}"
          echo "yml=${yml_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-${{ github.ref_name }}
          path: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.deb }}
            ${{ steps.artifacts.outputs.rpm }}
            ${{ steps.artifacts.outputs.yml }}
          if-no-files-found: error

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if ! gh release view "${tag}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --title "IRFlow Timeline ${version}" \
              --notes "Automated release for ${tag}."
          fi

          upload_args=()
          upload_args+=("${{ steps.artifacts.outputs.appimage }}")
          upload_args+=("${{ steps.artifacts.outputs.yml }}")

          if [ -n "${{ steps.artifacts.outputs.deb }}" ] && [ -f "${{ steps.artifacts.outputs.deb }}" ]; then
            upload_args+=("${{ steps.artifacts.outputs.deb }}")
          fi
          if [ -n "${{ steps.artifacts.outputs.rpm }}" ] && [ -f "${{ steps.artifacts.outputs.rpm }}" ]; then
            upload_args+=("${{ steps.artifacts.outputs.rpm }}")
          fi

          gh release upload "${tag}" "${upload_args[@]}" --clobber

      - name: Publish updater feed to object storage
        shell: bash
        run: |
          set -euo pipefail

          prefix="${IRFLOW_UPDATE_PREFIX#/}"
          prefix="${prefix%/}"
          if [ -n "${prefix}" ]; then
            destination="s3://${IRFLOW_UPDATE_BUCKET}/${prefix}"
          else
            destination="s3://${IRFLOW_UPDATE_BUCKET}"
          fi

          appimage_name="$(basename "${{ steps.artifacts.outputs.appimage }}")"
          yml_name="$(basename "${{ steps.artifacts.outputs.yml }}")"

          aws_s3_cp() {
            local source_path="$1"
            local destination_path="$2"
            shift 2

            if [ -n "${AWS_ENDPOINT_URL_S3:-}" ]; then
              aws s3 cp "${source_path}" "${destination_path}" --endpoint-url "${AWS_ENDPOINT_URL_S3}" "$@"
            else
              aws s3 cp "${source_path}" "${destination_path}" "$@"
            fi
          }

          aws_s3_cp "${{ steps.artifacts.outputs.appimage }}" "${destination}/${appimage_name}" \
            --cache-control "public, max-age=3600, immutable"

          aws_s3_cp "${{ steps.artifacts.outputs.yml }}" "${destination}/${yml_name}" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/yaml"
